<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#b9bdc2">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<title>Investment Calculator</title>
<style>
  :root { color-scheme: light; font-family: "Segoe UI", "Hiragino Kaku Gothic ProN", Meiryo, sans-serif; }
  * { box-sizing: border-box; }
  body { margin: 0; min-width: 280px; min-height: 100vh; background: linear-gradient(145deg,#f7f9fc,#edf2f8); color: #111827; }
  main { width: min(100%, 520px); margin: 0 auto; padding: 12px; }
  .calculator { padding: 14px; border: 1px solid #d8e2ef; border-radius: 20px; background: #ffffff; box-shadow: 0 14px 30px #20385f14, inset 0 1px #ffffff, inset 0 -1px #eef3f8; }
  .brand { margin: 0 2px 12px; }
  h1 { margin: 0; font-size: 1.05rem; letter-spacing: -.02em; font-weight: 750; }
  .brand small { display: none; }
  .screen { min-height: 106px; padding: 12px 15px 9px; border: 1px solid #ccd9e8; border-radius: 15px; background: linear-gradient(135deg,#f2f8ff,#e8f1fa 58%,#dfebf7); box-shadow: inset 0 1px 2px #ffffffcc, inset 0 -3px 8px #8fa6be1c; text-align: right; }
  .screen-meta { display: flex; justify-content: space-between; align-items: center; min-height: 17px; color: #64748b; font: 700 .72rem/1 ui-monospace,Consolas,monospace; }
  #expression { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  #display { overflow: hidden; padding: 6px 0 3px; color: #0f172a; font: 750 clamp(1.7rem,10vw,4.25rem)/1 ui-monospace,Consolas,monospace; letter-spacing: -.075em; white-space: nowrap; text-overflow: clip; }
  #unit { min-width: 3.5em; text-align: right; }
  .rate-panel { display: grid; grid-template-columns: 1fr auto; gap: 6px; align-items: center; margin: 12px 2px 8px; }
  .rate-panel label { grid-column: 1 / -1; color: #475569; font-size: .76rem; font-weight: 700; letter-spacing: .02em; }
  .rate-panel input { width: 100%; min-width: 0; padding: 10px 11px; border: 1px solid #d4deeb; border-radius: 9px; background: linear-gradient(#ffffff,#fbfcfe); color: #172033; box-shadow: inset 0 1px 2px #1e3a5f0a; font: 700 1rem ui-monospace,Consolas,monospace; }
  .saved { color: #64748b; font-size: .7rem; white-space: nowrap; }
  .fx { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin: 0 2px 12px; }
  button { min-height: clamp(54px,15vw,68px); border: 1px solid #d5deea; border-radius: 12px; color: #142033; background: linear-gradient(145deg,#ffffff,#f6f8fb); box-shadow: 0 2px 4px #1e3a5f10, inset 0 1px #ffffff; font: 800 clamp(28px,8vw,32px)/1 system-ui,sans-serif; touch-action: manipulation; cursor: pointer; }
  button:active { transform: translateY(1px); background: #f0f4f8; box-shadow: inset 0 2px 4px #1e3a5f12; }
  button:focus-visible, input:focus-visible { outline: 3px solid #60a5fa99; outline-offset: 2px; }
  .fx button { min-height: 42px; color: #1d4ed8; border-color: #bcd8fb; background: linear-gradient(#f5f9ff,#e9f3ff); box-shadow: 0 2px 4px #2563eb12, inset 0 1px #fff; font-size: .88rem; }
  .keypad { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); grid-template-areas: "clear back pct divide" "seven eight nine multiply" "four five six minus" "one two three plus" "zero double decimal equals"; gap: 7px; }
  #clear { grid-area: clear; color: #c93645; border-color: #fac6ce; background: linear-gradient(#fff6f7,#ffeaed); box-shadow: 0 2px 4px #e11d4810, inset 0 1px #fff; }
  #back { grid-area: back; }
  #pct { grid-area: pct; }
  [data-key="7"] { grid-area: seven; } [data-key="8"] { grid-area: eight; } [data-key="9"] { grid-area: nine; }
  [data-key="4"] { grid-area: four; } [data-key="5"] { grid-area: five; } [data-key="6"] { grid-area: six; }
  [data-key="1"] { grid-area: one; } [data-key="2"] { grid-area: two; } [data-key="3"] { grid-area: three; }
  [data-key="0"] { grid-area: zero; } [data-key="00"] { grid-area: double; } [data-key="."] { grid-area: decimal; }
  [data-op="÷"] { grid-area: divide; } [data-op="×"] { grid-area: multiply; } [data-op="−"] { grid-area: minus; }
  [data-op="+"] { grid-area: plus; } #equals { grid-area: equals; }
  button.op { color: #334155; border-color: #cedae8; background: linear-gradient(145deg,#f6f9fc,#e8eef5); }
  #equals { color: #ffffff; border-color: #1d5fe0; background: linear-gradient(145deg,#3b82f6,#2563d9); box-shadow: 0 3px 6px #2563eb28, inset 0 1px #ffffff55; }
  .history { margin-top: 12px; border-top: 1px solid #dfe7f0; background: #fcfdff; }
  .history summary { padding: 11px 2px; color: #475569; font-size: .82rem; font-weight: 750; cursor: pointer; }
  .history ul { max-height: 150px; margin: 0; padding: 0 4px 8px 24px; overflow: auto; color: #475569; font: .8rem/1.5 ui-monospace,Consolas,monospace; }
  @media (max-width: 360px) { main { padding: 6px; } .calculator { border-radius: 14px; padding: 9px; } button { min-height: 53px; font-size: 28px; } .screen { min-height: 92px; } .keypad { gap: 5px; } }
</style>
<main>
  <section class="calculator" aria-label="投資電卓">
    <header class="brand"><h1>INVESTMENT CALCULATOR</h1></header>
    <div class="screen" aria-live="polite">
      <div class="screen-meta"><span id="expression"></span><span id="unit">—</span></div>
      <div id="display">0</div>
    </div>
    <div class="rate-panel">
      <label for="rate">USD/JPY レート</label>
      <input id="rate" inputmode="decimal" placeholder="例: 150.25" aria-label="USD/JPY レート">
      <span class="saved">端末保存</span>
    </div>
    <div class="fx"><button id="toJpy" aria-label="米ドルを円へ換算">USD → JPY</button><button id="toUsd" aria-label="円を米ドルへ換算">JPY → USD</button></div>
    <div class="keypad" aria-label="計算キー">
      <button id="clear" aria-label="クリア">C</button><button id="back" data-action="backspace" aria-label="1文字削除">▶</button><button id="pct" aria-label="パーセント">%</button><button class="op" data-op="÷" aria-label="除算">÷</button>
      <button data-key="7">7</button><button data-key="8">8</button><button data-key="9">9</button>
      <button data-key="4">4</button><button data-key="5">5</button><button data-key="6">6</button><button class="op" data-op="×" aria-label="乗算">×</button>
      <button data-key="1">1</button><button data-key="2">2</button><button data-key="3">3</button><button class="op" data-op="−" aria-label="減算">−</button>
      <button data-key="0">0</button><button data-key="00">00</button><button data-key=".">.</button><button id="equals" aria-label="イコール">＝</button><button class="op" data-op="+" aria-label="加算">＋</button>
    </div>
    <details class="history"><summary>履歴</summary><ul id="history"></ul></details>
  </section>
</main>
<script type="module" src="app.js"></script>
</html>
